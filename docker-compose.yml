# docker-compose.yml

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: similepro_frontend
    environment:
      - PORT=3001   # Força o Next.js a rodar internamente na porta 3001
      - API_INTERNAL_URL=http://similepro_gateway:8080/api
      - TZ=America/Sao_Paulo # Define o fuso horário para São Paulo
    networks:
      - similepro_shared
    restart: always

networks:
  similepro_shared:
    name: similepro_global_net
    external: true
